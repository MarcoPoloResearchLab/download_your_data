---
mprlab_resources:
  schema_version: 3
  owner: download-your-data
  resources:
    - kind: private_values
      id: private
      bindings:
        google-web-client-id: DOWNLOAD_YOUR_DATA_GOOGLE_CLIENT_ID
        tauth-jwt-signing-key: DOWNLOAD_YOUR_DATA_TAUTH_JWT_SIGNING_KEY
    - kind: compose_project
      id: runtime
      images:
        - id: api-image
          repository: ghcr.io/marcopoloresearchlab/download-your-data
          visibility: public
          build:
            context: .
            dockerfile: Dockerfile
            target: api
            platforms:
              - linux/amd64
      services:
        - id: download-your-data-api
          image: api-image
          placement:
            group: gateway
            cardinality: one
          environment:
            DOWNLOAD_YOUR_DATA_ADDRESS:
              value: 0.0.0.0:8787
            DOWNLOAD_YOUR_DATA_API_ORIGIN:
              resource: public-api
              output: origin
            DOWNLOAD_YOUR_DATA_DATA_DIR:
              value: /var/lib/download-your-data
            DOWNLOAD_YOUR_DATA_GOOGLE_CLIENT_ID:
              resource: authentication
              output: google-web-client-id
            DOWNLOAD_YOUR_DATA_PUBLIC_ORIGIN:
              resource: website
              output: origin
            DOWNLOAD_YOUR_DATA_TAUTH_JWT_SIGNING_KEY:
              resource: authentication
              output: jwt-signing-key
            DOWNLOAD_YOUR_DATA_TAUTH_REFRESH_COOKIE_NAME:
              resource: authentication
              output: refresh-cookie-name
            DOWNLOAD_YOUR_DATA_TAUTH_SESSION_COOKIE_NAME:
              resource: authentication
              output: session-cookie-name
            DOWNLOAD_YOUR_DATA_TAUTH_TENANT_ID:
              resource: authentication
              output: tenant-id
            DOWNLOAD_YOUR_DATA_TAUTH_URL:
              resource: public-api
              output: origin
          mounts:
            - volume: data
              target: /var/lib/download-your-data
              read_only: false
          ports:
            - container_port: 8787
          readiness:
            protocol: http
            port: 8787
            path: /api/health
            expected_status: 200
      volumes:
        - id: data
          name: mprlab-download-your-data-data
          retention: retain
    - kind: runtime_capability
      id: http
      name: download-your-data.http
      version: 1
      project: runtime
      service: download-your-data-api
      endpoint:
        scope: same_host
        scheme: http
        alias: download-your-data-api
        port: 8787
      health:
        protocol: http
        path: /api/health
        expected_status: 200
    - kind: caddy_route
      id: public-api
      hostname: dyd-api.mprlab.com
      listener: https
      handlers:
        - id: shared-auth
          path_prefix: /auth
          upstream: tauth.http
          transport:
            protocol: http
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 30
            read_timeout_seconds: 80
        - id: shared-profile
          path_prefix: /me
          upstream: tauth.http
          transport:
            protocol: http
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 30
            read_timeout_seconds: 80
        - id: default
          path_prefix: /
          upstream: download-your-data.http
          transport:
            protocol: http
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 30
            read_timeout_seconds: 80
      tls:
        mode: automatic
      access:
        rate_limit:
          events: 300
          window_seconds: 10
    - kind: health_check
      id: public-health
      protocol: http
      url: https://dyd-api.mprlab.com/api/health
      expected_status: 200
    - kind: github_pages
      id: website
      repository: marcopoloresearchlab/download_your_data
      branch: gh-pages
      domain: dyd.mprlab.com
      url: https://dyd.mprlab.com/
      source:
        kind: container
        context: .
        dockerfile: Dockerfile
        target: pages
      verification:
        path: /.mprlab-release.json
    - kind: tauth_tenant
      id: authentication
      capability: tauth.tenants
      version: 1
      tenant:
        id: download-your-data
        display_name: Download Your Data
        origins:
          - https://dyd.mprlab.com
        google_web_client_id:
          resource: private
          output: google-web-client-id
        jwt_signing_key:
          resource: private
          output: tauth-jwt-signing-key
        cookie:
          domain: .mprlab.com
          session_name: download_your_data_session
          refresh_name: download_your_data_refresh
