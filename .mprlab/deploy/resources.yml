mprlab_resources:
    artifacts:
        container_images:
            - build:
                context: .
                dockerfile: Dockerfile
                platforms:
                    - linux/amd64
                target: api
              id: api-image
        web_bundles:
            - format: directory
              id: website
              source:
                context: .
                dockerfile: Dockerfile
                kind: container
                target: pages
    environment:
        private_inputs:
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: download-your-data-google-client-id
              variable: DOWNLOAD_YOUR_DATA_GOOGLE_CLIENT_ID
            - id: download-your-data-tauth-jwt-signing-key
              variable: DOWNLOAD_YOUR_DATA_TAUTH_JWT_SIGNING_KEY
            - id: download-your-data-tmdb-read-token
              variable: DOWNLOAD_YOUR_DATA_TMDB_READ_TOKEN
            - id: mprlab-tauth-management-url
              variable: MPRLAB_TAUTH_MANAGEMENT_URL
            - id: mprlab-tauth-provisioning-credentials
              variable: MPRLAB_TAUTH_PROVISIONING_CREDENTIALS
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 30m
                readiness: 2m
                request: 30s
                shutdown: 30s
                startup: 2m
        observations:
            http:
                - expected_status: 200
                  id: public-health
                  operations:
                    - name: app-deploy
                      restart_delay: 5s
                  protocol: http
                  url: https://dyd-api.mprlab.com/api/health
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 120
                increment: 1s
                initial: 1s
                maximum: 10s
                multiplier: 2
            - name: app-publish
              restart_delay: 5s
              polling:
                attempt_limit: 120
                increment: 1s
                initial: 1s
                maximum: 10s
                multiplier: 2
            - name: app-release
              restart_delay: 5s
              polling:
                attempt_limit: 120
                increment: 1s
                initial: 1s
                maximum: 10s
                multiplier: 2
            - name: app_lifecycle.repository_read
              restart_delay: 5s
              polling:
                attempt_limit: 120
                increment: 1s
                initial: 1s
                maximum: 10s
                multiplier: 2
        private_inputs:
            operations:
                - name: app-deploy
                  restart_delay: 5s
    owner: download-your-data
    publications:
        ghcr:
            images:
                - artifact: api-image
                  id: api-image
                  repository: ghcr.io/marcopoloresearchlab/download-your-data
        github_pages:
            sites:
                - artifact: website
                  branch: gh-pages
                  domain: dyd.mprlab.com
                  id: website
                  marker:
                    path: /.mprlab-release.json
                  repository: marcopoloresearchlab/download_your_data
    release:
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        docker_compose:
            projects:
                - id: runtime
                  operations:
                    - name: app-deploy
                      restart_delay: 5s
                  services:
                    - endpoints:
                        - endpoint:
                            alias: download-your-data-api
                            port: 8787
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /api/health
                            protocol: http
                          id: http
                          name: download-your-data.http
                          operations:
                            - name: app-deploy
                              restart_delay: 5s
                          version: 1
                        - endpoint:
                            alias: runtime-download-your-data-api-readiness
                            port: 8787
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /api/health
                            protocol: http
                          id: readiness
                          name: download-your-data.readiness.runtime.download-your-data-api
                          operations:
                            - name: app-deploy
                              restart_delay: 5s
                          version: 1
                      environment:
                        - name: DOWNLOAD_YOUR_DATA_ADDRESS
                          value: 0.0.0.0:8787
                        - name: DOWNLOAD_YOUR_DATA_API_ORIGIN
                          value: https://dyd-api.mprlab.com
                        - name: DOWNLOAD_YOUR_DATA_DATA_DIR
                          value: /var/lib/download-your-data
                        - input: download-your-data-google-client-id
                          name: DOWNLOAD_YOUR_DATA_GOOGLE_CLIENT_ID
                        - name: DOWNLOAD_YOUR_DATA_PUBLIC_ORIGIN
                          output: origin
                          target: website
                        - input: download-your-data-tauth-jwt-signing-key
                          name: DOWNLOAD_YOUR_DATA_TAUTH_JWT_SIGNING_KEY
                        - name: DOWNLOAD_YOUR_DATA_TAUTH_REFRESH_COOKIE_NAME
                          value: download_your_data_refresh
                        - name: DOWNLOAD_YOUR_DATA_TAUTH_SESSION_COOKIE_NAME
                          value: download_your_data_session
                        - name: DOWNLOAD_YOUR_DATA_TAUTH_TENANT_ID
                          value: download-your-data
                        - name: DOWNLOAD_YOUR_DATA_TAUTH_URL
                          value: https://dyd-api.mprlab.com
                        - input: download-your-data-tmdb-read-token
                          name: DOWNLOAD_YOUR_DATA_TMDB_READ_TOKEN
                      id: download-your-data-api
                      image:
                        publication: api-image
                      mounts:
                        - read_only: false
                          target: /var/lib/download-your-data
                          volume: data
                      placement:
                        cardinality: one
                        group: gateway
                      ports:
                        - container_port: 8787
                      readiness:
                        endpoint: readiness
                  volumes:
                    - id: data
                      name: mprlab-download-your-data-data
                      retention: retain
        github_pages:
            sites:
                - id: website
                  operations:
                    - name: app-deploy
                      restart_delay: 5s
                  publication: website
                  url: https://dyd.mprlab.com/
        ingress:
            caddy:
                routes:
                    - access:
                        rate_limit:
                            events: 300
                            window_seconds: 10
                      handlers:
                        - id: default
                          path_prefix: /
                          transport:
                            dial_timeout_seconds: 10
                            protocol: http
                            read_timeout_seconds: 80
                            response_header_timeout_seconds: 30
                          upstream: download-your-data.http
                        - id: shared-auth
                          path_prefix: /auth
                          transport:
                            dial_timeout_seconds: 10
                            protocol: http
                            read_timeout_seconds: 80
                            response_header_timeout_seconds: 30
                          upstream: tauth.http
                        - id: shared-profile
                          path_prefix: /me
                          transport:
                            dial_timeout_seconds: 10
                            protocol: http
                            read_timeout_seconds: 80
                            response_header_timeout_seconds: 30
                          upstream: tauth.http
                      hostname: dyd-api.mprlab.com
                      id: download-your-data-public-api
                      operations:
                        - name: app-deploy
                          timeouts:
                            startup: 1m
                            readiness: 5m
                          polling:
                            initial: 1s
                            maximum: 10s
                            increment: 1s
                            multiplier: 2
                            attempt_limit: 200
                      listener: https
                      tls:
                        mode: automatic
